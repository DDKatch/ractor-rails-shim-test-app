test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# RAILS_FEATURES.md row 125: a second, public service. The whole file is
# parsed as the service registry (top-level keys = service names), so this
# resolves in every env; the kino pre-builds it before the freeze.
test_public:
  service: Disk
  root: <%= Rails.root.join("tmp/storage_public") %>
  public: true

# RAILS_FEATURES.md row 128: an ENCRYPTED (custom) service — an app-defined
# ActiveStorage::Service::EncryptedDiskService (AES-256-GCM at rest). The
# class lives in lib/active_storage/service/ (required at boot via
# config/initializers/encrypted_storage.rb) so the service Configurator's
# `require "active_storage/service/encrypted_disk_service"` resolves and,
# on workers, no-ops (already loaded).
test_encrypted:
  service: EncryptedDisk
  root: <%= Rails.root.join("tmp/storage_encrypted") %>

