default: &default
  # C `pg` doesn't exist on JRuby: run the app with DB_ADAPTER=jdbcpostgresql
  # (activerecord-jdbcpostgresql-adapter). Default stays stock MRI `pg`.
  adapter: <%= ENV["DB_ADAPTER"] || "postgresql" %>
  encoding: unicode
  # Match the connection pool to the server's thread count (JRuby runs 20+)
  # via DB_POOL; default stays MRI's 5.
  pool: <%= ENV["DB_POOL"] || 5 %>
  host: 127.0.0.1
  username: dev
  # Disable GSSAPI/Kerberos auth to prevent SIGSEGV in forked workers.
  # macOS libpq probes CFPreferences which is not fork-safe.
  # See: https://github.com/ged/ruby-pg/issues/663
  # See: https://github.com/ged/ruby-pg/issues/684
  gssencmode: disable

# RAILS_FEATURES.md #81: multi-database layout. `primary` is the app's main
# database; `secondary` backs the AuditEntry model (`connects_to database:
# :secondary`) and proves connects_to / connected_to in worker Ractors.
development:
  primary:
    <<: *default
    database: ractor_rails_shim_test_app_dev
  secondary:
    <<: *default
    database: ractor_rails_shim_test_app_dev_secondary
    migrations_paths: db/secondary_migrate

test:
  primary:
    <<: *default
    database: ractor_rails_shim_test_app_test
  secondary:
    <<: *default
    database: ractor_rails_shim_test_app_test_secondary
    migrations_paths: db/secondary_migrate

production:
  primary:
    <<: *default
    # BENCH_DB_NAME lets the JRuby benchmark serve the test DB without
    # DATABASE_URL (which would force the C `postgresql` URL resolver).
    database: <%= ENV["BENCH_DB_NAME"] || "ractor_rails_shim_test_app_prod" %>
  secondary:
    <<: *default
    database: ractor_rails_shim_test_app_prod_secondary
    migrations_paths: db/secondary_migrate
