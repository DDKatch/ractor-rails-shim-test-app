default: &default
  adapter: postgresql
  encoding: unicode
  pool: 5
  host: 127.0.0.1
  username: dev
  # Disable GSSAPI/Kerberos auth to prevent SIGSEGV in forked workers.
  # macOS libpq probes CFPreferences which is not fork-safe.
  # See: https://github.com/ged/ruby-pg/issues/663
  # See: https://github.com/ged/ruby-pg/issues/684
  gssencmode: disable

development:
  <<: *default
  database: ractor_rails_shim_test_app_dev

test:
  <<: *default
  database: ractor_rails_shim_test_app_test

production:
  <<: *default
  database: ractor_rails_shim_test_app_prod
